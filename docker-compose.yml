services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-zaptobox}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-zaptobox}?schema=public
      JWT_TOKEN: ${JWT_TOKEN:?Defina JWT_TOKEN no .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Defina WEBHOOK_SECRET no .env}
      WEBHOOK_URL: ${DOCKER_WEBHOOK_URL:-http://host.docker.internal:3000/api/webhooks/whatsapp}
      AUTH_STORE: database
      SESSION_FOLDER_NAME: sessions
      WEBHOOK_QUEUE: "true"
      WEBHOOK_QUEUE_DIR: ./webhook-queue
      QUEUE_INTERVAL: ${QUEUE_INTERVAL:-0.1}
      SESSION: ${SESSION:-Linux}
      PHONE_NAME: ${PHONE_NAME:-Desktop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sessions:/zaptobox/sessions
      - webhooks:/zaptobox/webhook-queue
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaptobox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-zaptobox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaptobox} -d ${POSTGRES_DB:-zaptobox}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  sessions:
  webhooks:
